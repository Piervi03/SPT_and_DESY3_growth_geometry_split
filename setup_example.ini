[runtime]
sampler = test

[DEFAULT]
cosmosis_std_path = ${HOME}/cosmosis-standard-library
SPT_like_path = ${HOME}/SPT_NC_with_DES_WL
SPT_data_path = ${HOME}/SPT_cluster_data
SPT_survey_fields = %(SPT_like_path)s/data/SPT_SZ_ECS_500d_survey.txt
SPTcatalogfile = ${HOME}/SPT_cluster_data/SPT_SZ_pol_230214.fits
WLsimcalibfile = %(SPT_like_path)s/data/WLsimcalib_data_Megacam.py
HSTcalibfile = %(SPT_like_path)s/data/HST-39_200_X.txt
MCMF_lambda_min = %(SPT_like_path)s/data/MCMF_lambda_min.txt
surveyCutSZmax = 60.
observable_pairs = SZ_lambdacut_shallow SZ_lambdacut_deep richness_SZ SZ
pairs_zmin = .25 .25 .25 .25
pairs_zmax = 1.78 1.78 1.78 1.78
pairs_Nz = 154 154 154 154
richness_scatter_model = lognormal

