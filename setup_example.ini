timing = F
debug = T
quiet = T

[DES_WL_prior]
file =  %(SPT_like_path)s/DES_WL_prior_interface.py
DES_WL_priors_file = /archive2/users/grandis/DES-Y3-SPT/SZ-dnf/_18-25_metapost_

[p_k_baccoemu]
file = %(SPT_like_path)s/baccoemu_powerspectrum.py
z_min_max = 0. 2.
N_z = 21

[camb]
file = %(cosmosis_std_path)s/boltzmann/camb/camb_interface.py
mode=all
lmax=2500
feedback=0
power_spectra = delta_nonu
zmin = 0.
zmax = 2.
nz = 21

[compute_HMF]
file = %(SPT_like_path)s/compute_HMF_fit_interface.py
; Tinker08 or Bocquet16
fitting_function = Tinker08
recalc_HMF = T
save_HMF_to_disk = F
Deltacrit = 200.

[compute_HMF_MiraTitan]
file = %(SPT_like_path)s/compute_HMF_MiraTitan_interface.py
recalc_HMF = T
save_HMF_to_disk = F
Deltacrit = 200.
mcType = None
z_arr = 0. 2. 21.
M_arr = 13. 16. 301.

[set_scaling]
file = %(SPT_like_path)s/set_scaling_interface.py

[HMF_convo]
file = %(SPT_like_path)s/HMF_convo_interface.py
NPROC = 0

[abundance]
file = %(SPT_like_path)s/abundance_interface.py
surveyCutRedshift = .25 1.78
lambda_min = T
covmat = F
NPROC = 0

[mass_calibration]
file = %(SPT_like_path)s/mass_calibration_MC_interface.py
lambda_min = T
doWL = T
doYx = F
doMgas = F
doveldisp = F
dorichness = T
HSTfile = None
MegacamFile = None
DESfile = %(DES_lensing_path)s/WL_data_500kpch_1h_SPT.h5
DESboostfile = %(DES_lensing_path)s/WL_model/boost_smooth_dnf_SZ.txt
DESmiscenterfile = %(DES_lensing_path)s/WL_model/miscenter_3obs_mask_211020.txt
DEScentertype = SPT 
mcType = DK15
YXPARAM = SPT_XVP
NPROC = 0
surveyCutRedshift = .25 1.78
get_stacked_DES = F

[dNdzdlambda]
file = %(SPT_like_path)s/dNdzdlambda_interface.py
surveyCutRedshift = .25 1.78
NPROC = 0

[consistency]
file = %(cosmosis_std_path)s/utility/consistency/consistency_interface.py

[sigma8_rescale]
file = %(cosmosis_std_path)s/utility/sample_sigma8/sigma8_rescale.py

