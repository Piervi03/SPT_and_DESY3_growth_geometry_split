[runtime]
sampler = test

[DEFAULT]
cosmosis_std_path = ${HOME}/cosmosis-standard-library
SPT_like_path = ${HOME}/SPT_NC_with_DES_WL
SPT_data_path = ${HOME}/SPT_cluster_data
DES_lensing_path = /archive1/users/bocquet/DESY3
SPT_survey_fields = %(SPT_data_path)s/SPT_SZ_ECS_500d_survey_210529_mix.txt
SPTcatalogfile = %(SPT_data_path)s/SPT_meta_v3_cut.fits
SPT_doublecounts = %(SPT_data_path)s/SPT_doublecounts.py
WLsimcalibfile = %(SPT_data_path)s/WLsimcalib_data_Megacam.py
HSTcalibfile = %(SPT_data_path)s/HST-39_200_X.txt
MCMF_lambda_min = %(SPT_data_path)s/MCMF_lambda_min.txt
surveyCutSZmax = 60.
observable_pairs = SZ_lambdacut_shallow SZ_lambdacut_deep richness_SZ
pairs_zmin = .25 .25 .25
pairs_zmax = 1.78 1.78 1.78
pairs_Nz = 154 154 154
richness_scatter_model = lognormal

