[runtime]
sampler = multinest

[multinest]
live_points = 500
efficiency = .3
max_iterations = 10000
multinest_outfile_root = multinest_

[output]
filename = multinest.txt
format = text

[DEFAULT]
SPT_survey_fields = ${COSMOSIS_SRC_DIR}/modules/cosmosis_spt_cluster/data/SPT_survey.txt
SPT_doublecounts = ${COSMOSIS_SRC_DIR}/modules/cosmosis_spt_cluster/SPT_doublecounts.py
SPTcatalogfile = ${COSMOSIS_SRC_DIR}/modules/cosmosis_spt_cluster/data/SPT2500d.fits

[pipeline]
modules = consistency camb compute_HMF abundance mass_calibration
likelihoods = abundance mass_calibration
values = params_LCDM_SZWLYx.ini
priors = ${COSMOSIS_SRC_DIR}/modules/cosmosis_spt_cluster/WL_priors.ini ${COSMOSIS_SRC_DIR}/modules/cosmosis_spt_cluster/dlnMg_dlnr_prior.ini
extra_output = cosmological_parameters/sigma_8

[camb]
file = cosmosis-standard-library/boltzmann/camb/camb.so
mode=all
lmax=2500
feedback=0
zmin = 0.
zmax = 2.
nz = 21

[compute_HMF]
file = modules/cosmosis_spt_cluster/compute_HMF_interface.py
recalc_HMF = T
save_HMF_to_disk = F
Deltacrit = 500.

[abundance]
file = modules/cosmosis_spt_cluster/abundance_interface.py
SZmPivot = 3e14
surveyCutSZ = 5. 47.
surveyCutRedshift = .25 2.
NPROC = 2

[mass_calibration]
file = modules/cosmosis_spt_cluster/mass_calibration_interface.py
WLsimcalibfile = ${COSMOSIS_SRC_DIR}/modules/cosmosis_spt_cluster/WLsimcalib_data.py
doWL = T
doYx = T
doMgas = F
doveldisp = F
dorichness = F
HSTfile = ${COSMOSIS_SRC_DIR}/modules/cosmosis_spt_cluster/data/hst_20160930_xray.pkl
MegacamDir = ${COSMOSIS_SRC_DIR}/modules/cosmosis_spt_cluster/data/Megacam
DESDir = None
SZmPivot = 3e14
XraymPivot = 5e14
richmPivot = 3e14
YXPARAM = SPT_XVP
mcType = DK15
NPROC = 4
surveyCutSZ = 5. 47.
surveyCutRedshift = .25 2.

[consistency]
file = cosmosis-standard-library/utility/consistency/consistency_interface.py
