[runtime]
sampler = test

[emcee]
walkers = 32
samples = 2
nsteps = 1

[output]
filename = emcee.txt
format = text

[DEFAULT]
SPTdatafile = modules/cosmosis_spt_cluster/SPTcluster_data.py
SPTcatalogfile = modules/cosmosis_spt_cluster/data/SPT2500d.fits

[pipeline]
modules = consistency camb compute_HMF abundance mass_calibration
values = modules/cosmosis_spt_cluster/values.ini
likelihoods = abundance mass_calibration
priors = modules/cosmosis_spt_cluster/defaultpriors.ini
extra_output = cosmological_parameters/sigma8
DEBUG = F

[camb]
file = cosmosis-standard-library/boltzmann/camb/camb.so
mode=all
lmax=2500
feedback=0
zmin = 0.
zmax = 2.
nz = 21

[compute_HMF]
file = modules/cosmosis_spt_cluster/compute_HMF_interface.py
recalc_HMF = T
save_HMF_to_disk = F
Deltacrit = 500.

[abundance]
file = modules/cosmosis_spt_cluster/abundance_interface.py
SZmPivot = 3e14
surveyCutSZ = 5. 47.
surveyCutRedshift = 0.25 2.

[mass_calibration]
file = modules/cosmosis_spt_cluster/mass_calibration_interface.py
WLsimcalibfile = modules/cosmosis_spt_cluster/WLsimcalib_data.py
doWL = T
doYx = T
doMgas = F
doveldisp = F
dorichness = F
HSTfile = modules/cosmosis_spt_cluster/data/hst_20160930_xray.pkl
MegacamDir = modules/cosmosis_spt_cluster/data/Megacam
DESDir = None
SZmPivot = 3e14
XraymPivot = 5e14
richmPivot = 3e14
YXPARAM = SPT_XVP
Xdata = SPT_XVP
mcType = Duffy08
NPROC = 0
XrayProfileHandling = modelMgasPL
surveyCutSZ = 5. 47.
surveyCutRedshift = 0.25 2.

[consistency]
file = cosmosis-standard-library/utility/consistency/consistency_interface.py
