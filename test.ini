[runtime]
sampler = test

[pipeline]
modules = consistency compute_HMF abundance mass_calibration
values = modules/cosmosis_spt_cluster/values.ini
likelihoods = abundance mass_calibration
DEBUG = F

[camb]
file = cosmosis-standard-library/boltzmann/camb/camb.so
mode=all
lmax=2500
feedback=0
zmin = 0.
zmax = 2.
nz = 21

[compute_HMF]
file = modules/cosmosis_spt_cluster/compute_HMF/compute_HMF_interface.py
Deltacrit = 500.

[abundance]
file = modules/cosmosis_spt_cluster/abundance/abundance_interface.py
SPTdatafile = modules/cosmosis_spt_cluster/SPTcluster_data.py
SZmPivot = 3e14
surveyCutSZ = 5. 47.
surveyCutRedshift = 0.25 2.

[mass_calibration]
file = modules/cosmosis_spt_cluster/mass_calibration/mass_calibration_interface.py
SPTdatafile = modules/cosmosis_spt_cluster/SPTcluster_data.py
WLsimcalibfile = modules/cosmosis_spt_cluster/WLsimcalib_data.py
doWL = F
doXray = F
doveldisp = F
dorichness = F
HSTfile = None
MegacamDir = None
DESDir = None
SZmPivot = 3e14
XraymPivot = 5e14
richmPivot = 3e14
YXPARAM = 'SPT_XVP'
mcType = 'Duffy08'
NPROC = 0
XrayProfileHandling = 'modelMgasPL'
surveyCutSZ = 5. 47.
surveyCutRedshift = 0.25 2.

[consistency]
file = cosmosis-standard-library/utility/consistency/consistency_interface.py
